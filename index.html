<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品链接</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 116, 96, 0.14), transparent 28%),
        radial-gradient(circle at 85% 18%, rgba(39, 130, 216, 0.16), transparent 26%),
        linear-gradient(135deg, #fff8f3 0%, #f6fbff 48%, #f8f7f1 100%);
      color: #222;
      padding: 28px;
    }

    main {
      width: min(880px, 100%);
      padding: 42px 44px;
      border: 1px solid rgba(18, 31, 51, 0.08);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 50px rgba(31, 42, 68, 0.12);
      backdrop-filter: blur(10px);
    }

    .link-row {
      font-size: 22px;
      line-height: 1.75;
    }

    .link-row + .link-row {
      margin-top: 34px;
    }

    .label {
      font-weight: 700;
      color: #141922;
    }

    a {
      color: #0b62d6;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    a:hover,
    a:focus {
      text-decoration: underline;
    }

    .video-link {
      display: inline-flex;
      align-items: flex-start;
      gap: 12px;
    }

    .play-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      margin-top: 3px;
      border-radius: 50%;
      background: #0b62d6;
      box-shadow: 0 8px 20px rgba(11, 98, 214, 0.22);
      flex: 0 0 auto;
    }

    .play-icon::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid #fff;
    }

    .code {
      margin-top: 6px;
      padding-left: 44px;
      color: #4b5563;
      font-size: 20px;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      main {
        padding: 28px 22px;
        border-radius: 14px;
      }

      .link-row {
        font-size: 18px;
      }

      .code {
        padding-left: 0;
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="link-row">
      <span class="label">作品网址：</span><a href="https://xhs-cover-generator-2-0.onrender.com/" target="_blank" rel="noopener noreferrer">https://xhs-cover-generator-2-0.onrender.com/</a>
    </div>

    <div class="link-row">
      <a class="video-link" href="https://pan.baidu.com/s/1L42EI9dNeh_XdUbp-fvV_w?pwd=xhss" target="_blank" rel="noopener noreferrer">
        <span class="play-icon" aria-hidden="true"></span>
        <span><span class="label">作品5分钟讲解视频：</span>https://pan.baidu.com/s/1L42EI9dNeh_XdUbp-fvV_w?pwd=xhss</span>
      </a>
      <div class="code">提取码：xhss</div>
    </div>
  </main>
</body>
</html>
